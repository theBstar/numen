name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not file security issues here -
        see [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The steps, and the failing command with its output if there is one.
        A report without this usually cannot be acted on.
      placeholder: |
        1. Connect GitHub
        2. Ask "what is blocked?" in Slack
        3. The bot never replies; logs show ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Numen
      options:
        - Docker Compose
        - Local development (uvicorn)
        - Other
    validations:
      required: true

  - type: input
    id: llm
    attributes:
      label: LLM endpoint
      description: Which provider or local server, and which model.
      placeholder: Ollama, llama3.3
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive. This is rendered as code.
      render: shell
