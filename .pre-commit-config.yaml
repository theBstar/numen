repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: run tests
        entry: pytest -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
