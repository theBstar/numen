# Production stack for running Numen on your own host.
#
#   cp .env.example .env      # set NUMEN_DOMAIN, secrets, and an LLM endpoint
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Differences from docker-compose.yml, which is for evaluation only: images are
# built rather than bind-mounted, nothing reloads, the frontend is compiled to
# static assets instead of running a dev server, and Caddy terminates TLS and is
# the only service exposed to the network.
#
# Data lives in named volumes. Back up `numen-postgres` and `numen-falkordb`
# together - the graph references rows in Postgres.

services:
  app:
    build: .
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/numen
      DATABASE_APP_URL: postgresql+asyncpg://numen_app:${NUMEN_APP_PASSWORD}@db:5432/numen
      REDIS_URL: redis://redis:6379/0
      FALKORDB_URL: redis://falkordb:6379
      PYTHONPATH: /app
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Empty: the browser calls the same origin Caddy serves the app on.
        VITE_API_URL: ""
    expose:
      - "3000"
    restart: always

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: numen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      NUMEN_APP_PASSWORD: ${NUMEN_APP_PASSWORD:?set NUMEN_APP_PASSWORD in .env}
    volumes:
      - numen-postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - numen-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  falkordb:
    image: falkordb/falkordb:latest
    volumes:
      - numen-falkordb:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  caddy:
    image: caddy:2-alpine
    # The only service on the network. Everything else is reachable solely
    # over the internal compose network.
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A real hostname gets an automatic Let's Encrypt certificate. The
      # default serves plain HTTP on :80, which is only appropriate when
      # something in front of it already terminates TLS.
      NUMEN_DOMAIN: ${NUMEN_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - numen-caddy-data:/data
      - numen-caddy-config:/config
    depends_on:
      - app
      - frontend
    restart: always

volumes:
  numen-postgres:
  numen-redis:
  numen-falkordb:
  numen-caddy-data:
  numen-caddy-config:
